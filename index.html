<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber Registration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="registration-container">
    <h1>Barber Registration</h1>
    <form id="barber-form" class="registration-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter your phone number" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required />

      <label for="specialization">Specialization</label>
      <input type="text" id="specialization" placeholder="Enter your specialization (e.g., haircuts, shaving)" required />

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">Select</option>
        <option value="male">male</option>
        <option value="female">female</option>
        <option value="other">other</option>
      </select>

      <button type="submit">Register Barber</button>
    </form>
  </div>

  <script>
    document.getElementById('barber-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const specialization = document.getElementById('specialization').value;
      const gender = document.getElementById('gender').value;

      const response = await fetch('http://localhost:5500/register-barber', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, password, specialization, gender }),
      });

      const result = await response.json();
      alert(result.message || result.error);
    });
  </script>
</body>
</html>
